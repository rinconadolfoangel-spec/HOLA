<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fútbol Pong</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b12;font-family:system-ui,Arial;color:white;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:#167b3c}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#06351e,#0c6b35);padding:22px;text-align:center}
h1{font-size:clamp(38px,8vw,72px);margin:0 0 8px;text-shadow:0 5px 0 #06451f;letter-spacing:2px}
.sub{opacity:.9;margin-bottom:28px}
button{border:2px solid #d8ffe3;background:#f5fff7;color:#075327;border-radius:14px;padding:14px 24px;font-weight:800;font-size:18px;margin:7px;min-width:220px;box-shadow:0 5px 0 #06451f}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #06451f}
#hud{position:fixed;top:10px;left:0;right:0;display:none;align-items:center;justify-content:center;gap:20px;pointer-events:none;text-shadow:0 2px 4px #000;font-weight:900;font-size:clamp(22px,5vw,36px)}
#hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:12px;text-shadow:0 1px 3px #000;opacity:.85;pointer-events:none}
#back{position:fixed;top:10px;left:10px;display:none;min-width:0;padding:8px 13px;font-size:14px}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#00190dcc;flex-direction:column;text-align:center}
#overlay h2{font-size:42px;margin:0 0 12px}
.small{font-size:13px;opacity:.8;max-width:520px;line-height:1.5}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="menu" class="screen">
 <h1>⚽ FÚTBOL PONG</h1><div class="sub">Un partido rápido. ¡Que no se te escape!</div>
 <button onclick="start('ai')">Jugar contra la computadora</button>
 <button onclick="start('local')">Multijugador local (2 jugadores)</button>
 <div class="small">Desliza el dedo por tu lado de la cancha para mover tu barra.<br>En multijugador, cada jugador controla su lado.</div>
</div>
<div id="hud"><span id="leftScore">0</span><span>—</span><span id="rightScore">0</span></div>
<button id="back" onclick="toMenu()">Menú</button>
<div id="hint"></div>
<div id="overlay"><h2 id="result">¡GOOOL!</h2><div id="resultSub"></div><button onclick="restart()">Volver a jugar</button><button onclick="toMenu()">Menú principal</button></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,mode='ai',running=false,raf=0,scoreL=0,scoreR=0,last=0,serveTimer=0;
const paddle={w:14,h:Math.min(110,innerHeight*.22),margin:30};
let leftY=0,rightY=0,ball={x:0,y:0,vx:0,vy:0,r:9},touches={};
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);paddle.h=Math.min(110,H*.22);leftY=clamp(leftY||H/2,H/2-paddle.h/2,H/2+paddle.h/2);rightY=clamp(rightY||H/2,H/2-paddle.h/2,H/2+paddle.h/2);if(!ball.x)resetBall(1)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function resetBall(dir){ball.x=W/2;ball.y=H/2;ball.vx=dir*5;ball.vy=(Math.random()-.5)*4;serveTimer=40}
function start(m){mode=m;scoreL=scoreR=0;updateScore();document.getElementById('menu').style.display='none';document.getElementById('overlay').style.display='none';document.getElementById('hud').style.display='flex';document.getElementById('back').style.display='block';document.getElementById('hint').textContent=m==='ai'?'TÚ: lado izquierdo · CPU: lado derecho':'JUGADOR 1: izquierda · JUGADOR 2: derecha';leftY=rightY=H/2;resetBall(Math.random()<.5?1:-1);running=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function updateScore(){document.getElementById('leftScore').textContent=scoreL;document.getElementById('rightScore').textContent=scoreR}
function toMenu(){running=false;cancelAnimationFrame(raf);document.getElementById('menu').style.display='flex';document.getElementById('hud').style.display='none';document.getElementById('back').style.display='none';document.getElementById('hint').textContent='';document.getElementById('overlay').style.display='none'}
function restart(){start(mode)}
function endGame(){running=false;document.getElementById('result').textContent=scoreL>scoreR?'¡GANASTE!':'¡BUEN PARTIDO!';document.getElementById('resultSub').textContent=`Marcador final ${scoreL} - ${scoreR}`;document.getElementById('overlay').style.display='flex'}
function loop(t){if(!running)return;let dt=Math.min((t-last)/16.67,2);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function update(dt){
 if(mode==='ai'){let target=ball.y;rightY+=clamp(target-rightY,-4.3*dt,4.3*dt);rightY=clamp(rightY,paddle.h/2,H-paddle.h/2)}
 if(serveTimer>0){serveTimer-=dt;return}
 ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
 if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}
 if(ball.y+ball.r>H){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy)}
 const lx=paddle.margin+paddle.w,rx=W-paddle.margin-paddle.w;
 if(ball.vx<0&&ball.x-ball.r<=lx&&ball.x>paddle.margin&&Math.abs(ball.y-leftY)<paddle.h/2+ball.r){ball.x=lx+ball.r;ball.vx=Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-leftY)/paddle.h*7}
 if(ball.vx>0&&ball.x+ball.r>=rx&&ball.x<W-paddle.margin&&Math.abs(ball.y-rightY)<paddle.h/2+ball.r){ball.x=rx-ball.r;ball.vx=-Math.abs(ball.vx)*1.04;ball.vy+=(ball.y-rightY)/paddle.h*7}
 ball.vx=clamp(ball.vx,-10,10);ball.vy=clamp(ball.vy,-8,8);
 // Solo las aberturas centrales son portería.
 const goalHalf=Math.min(72,H*.19),goalTop=H/2-goalHalf,goalBottom=H/2+goalHalf;
 if(ball.x<0){if(ball.y>goalTop&&ball.y<goalBottom){scoreR++;updateScore();if(scoreR>=5){endGame();return}resetBall(-1)}else{ball.x=ball.r;ball.vx=Math.abs(ball.vx)}}
 if(ball.x>W){if(ball.y>goalTop&&ball.y<goalBottom){scoreL++;updateScore();if(scoreL>=5){endGame();return}resetBall(1)}else{ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // cancha y franjas
 ctx.fillStyle='#168344';ctx.fillRect(0,0,W,H);let stripe=W/10;for(let i=0;i<10;i++){if(i%2===0){ctx.fillStyle='#1b8d4b';ctx.fillRect(i*stripe,0,stripe,H)}}
 ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.strokeRect(8,8,W-16,H-16);
 ctx.beginPath();ctx.moveTo(W/2,8);ctx.lineTo(W/2,H-8);ctx.stroke();
 ctx.beginPath();ctx.arc(W/2,H/2,Math.min(H*.16,75),0,Math.PI*2);ctx.stroke();
 // áreas decorativas
 ctx.strokeRect(8,H*.29,W*.12,H*.42);ctx.strokeRect(W-W*.12-8,H*.29,W*.12,H*.42);
 // porterías: hueco central en cada extremo
 const gh=Math.min(72,H*.19),gy=H/2-gh;
 ctx.clearRect(0,gy,8,gh);ctx.clearRect(W-8,gy,8,gh);
 ctx.strokeStyle='#f8fff9';ctx.lineWidth=4;ctx.strokeRect(0,gy,12,gh);ctx.strokeRect(W-12,gy,12,gh);
 // barritas
 drawPaddle(paddle.margin,leftY,'#f8f8f8');drawPaddle(W-paddle.margin-paddle.w,rightY,'#ffdf55');
 // balón
 ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.strokeStyle='#202020';ctx.lineWidth=1.5;ctx.stroke();
}
function drawPaddle(x,y,c){ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(x+3,y-paddle.h/2+3,paddle.w,paddle.h);ctx.fillStyle=c;ctx.fillRect(x,y-paddle.h/2,paddle.w,paddle.h);ctx.strokeStyle='#173b25';ctx.lineWidth=2;ctx.strokeRect(x,y-paddle.h/2,paddle.w,paddle.h)}
function pointerY(e){const r=canvas.getBoundingClientRect();return clamp(e.clientY-r.top,paddle.h/2,H-paddle.h/2)}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches[e.pointerId]=e.clientX<W/2?'left':'right';moveTouch(e)});
canvas.addEventListener('pointermove',e=>{if(touches[e.pointerId])moveTouch(e)});
canvas.addEventListener('pointerup',e=>delete touches[e.pointerId]);canvas.addEventListener('pointercancel',e=>delete touches[e.pointerId]);
function moveTouch(e){const side=touches[e.pointerId];if(side==='left')leftY=pointerY(e);else if(mode==='local')rightY=pointerY(e)}
window.addEventListener('resize',resize);resize();
</script>
</body></html>
